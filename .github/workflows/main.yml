name: first workflow
on:  
  push:
   branches: 
     - main
jobs:
  example-job:
    runs-on: ubuntu-latest
    steps:
      - name: print a welcome message
        run: echo "welcome to our first workflow"
      
      - name: checkout kernel version 
        run : uname -r
      
      - name: checkout repo  
        uses: actions/checkout@V4
      - name: list repo files 
        run : ls -la 
        

    
